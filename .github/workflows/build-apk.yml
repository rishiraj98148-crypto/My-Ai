name: Build My AI APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Find My AI ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_ENV

      - name: Extract My AI
        run: |
          rm -rf www
          mkdir -p www

          unzip -o "$ZIP_FILE" -d extracted

          INDEX_FILE=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          INDEX_DIR=$(dirname "$INDEX_FILE")

          cp -r "$INDEX_DIR"/. www/

          echo "Website files:"
          ls -la www

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "my-ai-app",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "build": "echo My AI"
            },
            "dependencies": {
              "@capacitor/core": "^7.4.3",
              "@capacitor/android": "^7.4.3",
              "@capacitor/cli": "^7.4.3",
              "@capacitor-community/speech-recognition": "^7.0.1",
              "@capacitor-community/text-to-speech": "^8.0.2"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rishiraj.myai",
            "appName": "My AI",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

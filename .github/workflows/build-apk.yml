name: Build My AI APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout project
      - name: Checkout project
        uses: actions/checkout@v4


      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"


      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # 4. Find My AI ZIP
      - name: Find My AI ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # 5. Extract My AI
      - name: Extract My AI
        run: |
          rm -rf www extracted
          mkdir -p www extracted

          unzip -o "$ZIP_FILE" -d extracted

          INDEX_FILE=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found."
            exit 1
          fi

          INDEX_DIR=$(dirname "$INDEX_FILE")

          cp -r "$INDEX_DIR"/. www/

          echo "Website files:"
          ls -la www


      # 6. Create package.json
      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "my-ai-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0",
              "@capacitor/cli": "^8.0.0",
              "@capacitor-community/speech-recognition": "^7.0.1",
              "@capacitor-community/text-to-speech": "^8.0.2",
              "@capacitor-community/admob": "^8.0.0"
            }
          }
          EOF


      # 7. Install dependencies
      - name: Install dependencies
        run: |
          npm install


      # 8. Create Capacitor config
      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.rishiraj.myai",
            "appName": "My AI",
            "webDir": "www"
          }
          EOF


      # 9. Add Android
      - name: Add Android
        run: |
          npx cap add android


      # 10. Sync Android
      - name: Sync Android
        run: |
          npx cap sync android


      # 11. Configure AdMob App ID
      - name: Configure AdMob App ID
        run: |
          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/admob_strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="admob_app_id">ca-app-pub-3308425772475057~8246998513</string>
          </resources>
          EOF


      # 12. Add AdMob metadata correctly
      - name: Add AdMob metadata
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          meta = """        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="@string/admob_app_id" />"""

          # Do not add it twice
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:

              pattern = r"(<application\b[^>]*>)"

              text, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + "\n" + meta,
                  text,
                  count=1
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: <application> tag not found."
                  )

              manifest.write_text(text)

          print("AdMob metadata configured successfully.")

          print("\nFinal AndroidManifest.xml:")
          print(manifest.read_text())
          PY


      # 13. Verify Android Manifest
      - name: Verify Android Manifest
        run: |
          echo "Checking AndroidManifest.xml..."

          if grep -q "com.google.android.gms.ads.APPLICATION_ID" \
            android/app/src/main/AndroidManifest.xml; then

            echo "AdMob App ID metadata found."

          else

            echo "ERROR: AdMob metadata not found."
            exit 1

          fi

          echo "Checking AdMob App ID..."

          if grep -q "admob_app_id" \
            android/app/src/main/res/values/admob_strings.xml; then

            echo "AdMob App ID found."

          else

            echo "ERROR: AdMob App ID not found."
            exit 1

          fi


      # 14. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace


      # 15. Build Release AAB
      - name: Build Release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace


      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk


      # 17. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: My-AI-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
